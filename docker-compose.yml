name: "Chess Fest Reading Knockout Test Server"
services:
  database:
    image: "postgres:latest"
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: magnus
      POSTGRES_PASSWORD: bong-cloud
      POSTGRES_DB: chess-tournament
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magnus -d chess-tournament"]
      interval: 5s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      FRONTEND_EXTERNAL_BASE_URL: "http://localhost:3000"
      INTERNAL_API_URL: "http://backend:8081"
    depends_on:
      - backend
    networks:
      - net
    develop:
      watch:
        - action: rebuild
          path: frontend
        - action: rebuild
          path: go.mod
        - action: rebuild
          path: go.sum
        - action: rebuild
          path: Makefile
        - action: rebuild
          path: backend/api 
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: "user=magnus password=bong-cloud dbname=chess-tournament host=database port=5432 sslmode=disable"
      GITHUB_ORGANISATION: Nag-s-Head
      OAUTH_CLIENT_ID: "test"
      OAUTH_CLIENT_SECRET: "test"
      ADDR: "0.0.0.0:8081"
      FRONTEND_EXTERNAL_BASE_URL: "http://localhost:3000"
      TEST_MODE: "true" 
    expose:
      - "8081"
    networks:
      - net
    depends_on:
      database:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: backend
        - action: rebuild
          path: go.mod
        - action: rebuild
          path: go.sum
        - action: rebuild
          path: Makefile
networks:
  net:
    name: "ChessFestReadingNetwork"
    driver: bridge
